<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Schaakspel Projectweek 1 2026</h1>

        <p>Gebouwd in HTML, CSS, JavaScript door Redouan, Mikolaj, Wiktoria, Grantas</p>
    </header>

    <main class="game-layout">
        <div class="scoreboard">
    <h2> Scoreboard</h2>
    <p> White: <span id="whiteScore">0</span></p>
    <p> Black: <span id="blackScore">0</span></p>
</div>
        <section class="board-area" aria-label="Chess board and captured pieces">
            <!-- JavaScript fills these containers with captured pieces. -->
            <div id="captured-black" class="captured" aria-label="Captured black pieces"></div>
            <div class="board-frame">
                <div id="gameboard" aria-label="Chess board"></div>
                <div class="file-coordinates" aria-hidden="true">
                    <span>a</span><span>b</span><span>c</span><span>d</span>
                    <span>e</span><span>f</span><span>g</span><span>h</span>
                </div>
                <div class="rank-coordinates" aria-hidden="true">
                    <span>8</span><span>7</span><span>6</span><span>5</span>
                    <span>4</span><span>3</span><span>2</span><span>1</span>
                </div>
            </div>

            <div id="captured-white" class="captured" aria-label="Captured white pieces"></div>
        </section>

        <aside class="game-panel" aria-label="Game controls">

            <div class="turn-indicator">
                <p>It's <span id="player"></span>'s turn</p>
            </div>

            <p id="King-display" class="game-message" aria-live="polite"></p>

            <section class="move-history" aria-labelledby="move-history-heading">
                <h2 id="move-history-heading">Move history</h2>
                <ol id="move-history" aria-live="polite"></ol>
            </section>

            <div class="game-actions">
                <button id="resetButton" class="reset">New game</button>
                <button id="changeboard" class="secondary-button">Change theme</button>
                <button id="rotateBoard" class="secondary-button">Rotate board</button>
             </div>
        </aside>
    </main>

    <dialog id="promotion-dialog" aria-labelledby="promotion-heading">
        <h2 id="promotion-heading">Pawn promotion</h2>
        <p>Select a piece to promote your pawn:</p>
        <div class="promotion-options">
            <button class="promotion-piece" type="button" data-piece="queen">Queen</button>
            <button class="promotion-piece" type="button" data-piece="rook">Rook</button>
            <button class="promotion-piece" type="button" data-piece="bishop">Bishop</button>
            <button class="promotion-piece" type="button" data-piece="knight">Knight</button>
        </div>
    </dialog>

    <dialog id="win-dialog">
        <h2 id="win-message"></h2>
        <button id="view-board-button" type="button">View board</button>
        <button id="new-game-button" type="button">New game</button>
    </dialog>

    <script src="piece.js"></script>
    <script src="main.js"></script>
    <script src="movement.js"></script>
    <script src="promotion.js"></script>
    <script src="check.js"></script>
    <script src="pieceHighlight.js"></script>
    <script src="drag.js"></script>
    <script src="scoreboard.js"></script>

</body>
</html>
